<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#15110E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="継ぐ">
<title>継ぐ — 刀鍛冶の工程</title>
<style>
:root{--bg:#15110E;--card:#241C16;--line:#3E3227;--ink:#F0E7D8;--mute:#9C8D7A;--fire:#E2662A;--gold:#D9A441;--steel:#9FB3C8}
*{box-sizing:border-box;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 8px);-webkit-text-size-adjust:100%}
#app{max-width:560px;margin:0 auto;padding:10px 10px 90px}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.hud{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 2px;border-bottom:1px solid var(--line)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.row.s{font-size:10.5px;color:var(--mute);margin-top:4px}
.zeni{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.zeni i{font-style:normal;font-size:13px;color:var(--mute);margin-left:3px}
.inc{font-size:12px;color:var(--steel);font-variant-numeric:tabular-nums;text-align:right}
.plus{display:block;font-size:11px;color:var(--gold)}
.bn{margin-top:7px;font-size:11px;color:var(--mute);background:#1E1813;border-left:2px solid var(--fire);padding:5px 8px;min-height:32px}
.bn b{color:var(--fire)}
.chips{display:flex;gap:4px;margin-top:9px;overflow-x:auto;padding-bottom:2px}
.chip{flex:none;padding:5px 8px;border:1px solid var(--line);background:#1B1611;color:var(--mute);text-align:center}
.chip b{display:block;font-size:11px;font-weight:400}
.chip em{display:block;font-style:normal;font-size:9px;margin-top:1px}
.chip.on{border-color:var(--gold);color:var(--ink);background:#2E2519}
.chip.bnc{border-color:var(--fire);color:var(--fire)}
.chip.lk{opacity:.5}
.chip.jump{color:var(--fire);border-color:var(--fire);font-size:10px}
.st{border:1px solid var(--line);background:var(--card);padding:9px 10px;margin-bottom:0}
.st.bn2{border-color:var(--fire)}
.st.lock{opacity:.55;text-align:center;padding:14px 10px;border-style:dashed}
.sthead{display:flex;align-items:center;gap:7px;margin-bottom:7px}
.num{font-size:10px;width:17px;height:17px;line-height:16px;text-align:center;border:1px solid var(--line);color:var(--mute)}
.stname{font-family:"Hiragino Mincho ProN",serif;font-size:15px}
.tag{font-size:9.5px;background:var(--fire);color:#fff;padding:1px 6px}
.cap{margin-left:auto;font-size:10.5px;color:var(--steel);font-variant-numeric:tabular-nums}
.body{display:flex;gap:8px}
.work{flex:1;min-width:0;text-align:left;background:#1B1611;border:1px solid var(--gold);color:var(--ink);padding:10px;touch-action:manipulation;user-select:none}
.work:active{background:#33261A}
.verb{display:block;font-family:"Hiragino Mincho ProN",serif;font-size:15px}
.hand{display:block;font-size:10px;color:var(--gold);margin-top:2px}
.stock{display:block;font-size:10px;color:var(--mute);margin-top:5px;min-height:14px;font-variant-numeric:tabular-nums}
.crew{width:158px;flex:none}
.figs{height:26px;display:flex;align-items:center;gap:1px;overflow:hidden;font-size:18px;color:var(--gold)}
.figs em{font-style:normal;font-size:10px;color:var(--mute);margin-left:4px}
.buys{display:flex;flex-direction:column;gap:4px;margin-top:3px}
.b{text-align:left;padding:6px 7px;border:1px solid var(--line);background:#1B1611;color:var(--mute)}
.b.ok{border-color:var(--gold);color:var(--ink)}
.b b{display:block;font-size:11px;font-weight:400}
.b em{display:block;font-style:normal;font-size:9.5px;color:var(--fire);font-variant-numeric:tabular-nums}
.desc{font-size:10px;color:var(--mute);margin-top:6px;line-height:1.6;min-height:16px}
.flow{text-align:center;font-size:10px;color:var(--mute);padding:4px 0;letter-spacing:.14em}
.flow.done{color:var(--gold)}
.over{display:block;color:var(--fire);font-size:9.5px;letter-spacing:0;margin-top:2px}
.dock{position:fixed;left:0;right:0;bottom:0;display:flex;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line);max-width:560px;margin:0 auto}
.dockb{flex:1;font-size:12px;padding:10px 4px;border:1px solid var(--line);background:#1E1813;color:var(--mute)}
.dockb.hot{border-color:var(--fire);color:var(--ink);background:#33190F}
.dockb:disabled{opacity:.55}
.dockb b{display:block;font-size:9.5px;color:var(--gold);font-weight:400;margin-top:2px}
.toasts{position:fixed;left:0;right:0;bottom:78px;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:30}
.toast{background:#33281F;border:1px solid var(--gold);font-size:11.5px;padding:7px 13px;max-width:92%}
.wrap{position:fixed;inset:0;background:rgba(10,8,6,.62);z-index:40;display:none;align-items:flex-end;justify-content:center}
.wrap.on{display:flex}
.sheet{width:100%;max-width:560px;max-height:84%;overflow:auto;background:#241C16;border-top:2px solid var(--gold);padding:14px 14px 26px}
.shead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.shead b{font-family:"Hiragino Mincho ProN",serif;font-size:16px;color:var(--gold);letter-spacing:.1em}
.close{font-size:11px;background:none;border:1px solid var(--line);color:var(--mute);padding:6px 12px}
.p{font-size:12px;line-height:1.95;margin:0 0 12px}
.p b{color:var(--gold)}
.big{width:100%;font-size:14px;padding:13px;background:var(--fire);border:0;color:#fff}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 8px;width:100%;text-align:left;background:#1B1611;border:1px solid var(--line);color:var(--ink);padding:10px 11px;margin-bottom:6px;opacity:.6}
.item.can{opacity:1;border-color:var(--gold)}.item.got{opacity:1;border-color:var(--steel)}
.iname{font-family:"Hiragino Mincho ProN",serif;font-size:14px}
.icost{font-size:11.5px;color:var(--fire)}
.idesc{grid-column:1/3;font-size:10.5px;color:var(--mute)}
dl{margin:0 0 10px;display:grid;gap:5px;font-size:12px}
dl div{display:flex;justify-content:space-between;border-bottom:1px dotted var(--line);padding-bottom:3px}
dt{color:var(--mute)}dd{margin:0;font-variant-numeric:tabular-nums}
.sbtn{flex:1;font-size:12px;padding:10px;background:none;border:1px solid var(--line);color:var(--ink)}
.sbtn.danger{border-color:var(--fire);color:var(--fire)}
@media (max-width:400px){.crew{width:140px}.zeni{font-size:26px}}
</style>
</head>
<body>
<div id="app"></div>
<div class="dock" id="dock"></div>
<div class="toasts" id="toasts"></div>
<div class="wrap" id="wrap"><div class="sheet" id="sheet"></div></div>
<script>
"use strict";
/* ===== 定数 ===== */
var SAVE="tsugu-line-html-v1", WG=1.18, TG=3.2, TM=1.6, VSTEP=3.6, BUFCAP=100;
var SHORT=["たたら","積み","鍛錬","素延","焼入","研ぎ","銘"];
var ST=[
 {name:"たたら",verb:"鞴を踏む",makes:"玉鋼",rate:1.00,wname:"番子",wcost:15,tname:"大鞴",tcost:150,at:0,desc:"砂鉄と炭を三日三晩。すべての始まり。"},
 {name:"積み沸かし",verb:"積んで沸かす",makes:"積沸し",rate:0.80,wname:"弟子",wcost:90,tname:"大炉",tcost:900,at:9000,desc:"小割りにした玉鋼を積み、藁灰をまぶして沸かす。"},
 {name:"折り返し鍛錬",verb:"折り返す",makes:"鍛え鋼",rate:0.55,wname:"向う槌",wcost:700,tname:"水車鎚",tcost:7000,at:58000,desc:"折っては延ばし十五回。不純を叩き出す。"},
 {name:"素延べ・火造り",verb:"形を打つ",makes:"刀の形",rate:0.45,wname:"弟子",wcost:5000,tname:"型と鏨",tcost:50000,at:180000,desc:"棒状に延ばし、切先と刃をつくる。"},
 {name:"土置き・焼入れ",verb:"焼きを入れる",makes:"焼刃",rate:0.35,wname:"弟子",wcost:40000,tname:"焼刃土",tcost:400000,at:630000,desc:"焼刃土を置き、赤めて水へ。刃文と反りが生まれる。"},
 {name:"研ぎ",verb:"研ぐ",makes:"研ぎ上",rate:0.28,wname:"研師",wcost:350000,tname:"砥石一式",tcost:3500000,at:1600000,desc:"荒砥から仕上げまで。地鉄の景色が現れる。"},
 {name:"銘切り・拵え",verb:"銘を切る",makes:"一振り",rate:0.22,wname:"白銀師",wcost:3000000,tname:"鏨と漆",tcost:30000000,at:3800000,desc:"茎に銘を切り、鞘と柄を誂えて納める。"}
];
var KUFU=[
 {id:"ude",name:"工房の腕",desc:"すべての工程が1.25倍",base:5000,growth:6,rep:1},
 {id:"te",name:"手際",desc:"手作業で流せる数が2倍",base:1500,growth:8,rep:1},
 {id:"okiba",name:"置き場を広げる",desc:"各工程の置き場が+100",base:2500,growth:4,rep:1},
 {id:"sumi",name:"炭焼き窯",desc:"たたらが3倍",base:30000,target:0},
 {id:"mukou",name:"三人掛かりの向う槌",desc:"折り返し鍛錬が3倍",base:600000,target:2},
 {id:"tsuchi",name:"秘伝の焼刃土",desc:"土置き・焼入れが3倍",base:9000000,target:4},
 {id:"togiba",name:"研ぎ場を広げる",desc:"研ぎが3倍",base:80000000,target:5},
 {id:"mise",name:"店を構える",desc:"納める刀の値が2倍",base:400000000}
];
var SHOP=[
 {id:"kazuuchi",name:"数打ち",cost:3,desc:"手作業で一度に流せる数が3倍"},
 {id:"bankonoko",name:"番子の子",cost:5,desc:"たたらの速さが2倍"},
 {id:"aizuchi",name:"相槌",cost:8,desc:"すべての工程の速さが1.5倍"},
 {id:"ro",name:"炉の火を絶やさぬ",cost:10,desc:"留守のあいだも全速で進む"},
 {id:"kuden",name:"口伝",cost:12,desc:"代替わり後、工程3まで開いた状態で始まる"},
 {id:"mekiki",name:"目利き",cost:18,desc:"弟子と道具の費えが20%やすい"},
 {id:"hiden",name:"秘伝の土置き",cost:30,desc:"納める刀の値が2倍"},
 {id:"kaiden",name:"皆伝",cost:60,desc:"代替わり後、工程5まで開き、各工程に弟子が3人"},
 {id:"takuwae",name:"開始の蓄え",cost:25,desc:"代替わりのたび、技の数×5000文 を持って始まる"},
 {id:"kan",name:"代々の勘",cost:20,growth:2.2,rep:1,desc:"すべての工程が1.3倍（重ねて買えます）"},
 {id:"hayawaza",name:"早業",cost:15,growth:2.5,rep:1,desc:"手作業が3倍（重ねて買えます）"}
];
/* ===== 数値 ===== */
var UN=[[1e20,"垓"],[1e16,"京"],[1e12,"兆"],[1e8,"億"],[1e4,"万"]];
function fmt(n){if(!isFinite(n))return"∞";if(!n||n<0)return"0";if(n<100)return(Math.round(n*10)/10)+"";
 if(n<1e4)return Math.floor(n).toLocaleString("ja-JP");
 if(n>=1e24){var e=Math.floor(Math.log10(n));return(n/Math.pow(10,e)).toFixed(2)+"×10^"+e;}
 for(var i=0;i<UN.length;i++){if(n>=UN[i][0]){var x=n/UN[i][0];return(x>=100?Math.floor(x):x.toFixed(2))+UN[i][1];}}
 return Math.floor(n)+"";}
function ftime(s){if(!isFinite(s)||s<=0)return"—";if(s<60)return Math.ceil(s)+"秒";if(s<3600)return Math.floor(s/60)+"分";
 if(s<86400)return(s/3600).toFixed(1)+"時間";return(s/86400).toFixed(1)+"日";}
/* ===== 状態 ===== */
function fresh(c){var s={zeni:0,total:0,hand:0,made:0,rate:0,buf:[],w:[],tool:[],open:1,waza:0,wazaTotal:0,shop:{},up:{},gens:0,
 bestTotal:0,lastBest:0,runStart:Date.now(),start:Date.now(),t:Date.now()};
 for(var i=0;i<ST.length;i++){s.buf.push(0);s.w.push(i===0?1:0);s.tool.push(0);}
 if(c)for(var k in c)s[k]=c[k];return s;}
var S=fresh();
function owns(id){return !!S.shop[id];}
function lv(id){return S.up[id]||0;}
function kufuCost(it){return it.rep?it.base*Math.pow(it.growth,lv(it.id)):it.base;}
function wazaCost(it){return it.rep?Math.ceil(it.cost*Math.pow(it.growth,lv(it.id))):it.cost;}
function bufcap(){return 100+100*lv("okiba");}
function speedMult(){return (1+0.08*S.wazaTotal)*(owns("aizuchi")?1.5:1)*Math.pow(1.25,lv("ude"))*Math.pow(1.3,lv("kan"));}
function stationBonus(i){var m=1;
 if(i===0&&owns("bankonoko"))m*=2;
 for(var k=0;k<KUFU.length;k++){var it=KUFU[k];if(it.target===i&&owns(it.id))m*=3;}
 return m;}
function cap(i){return S.w[i]*ST[i].rate*Math.pow(TM,S.tool[i])*speedMult()*stationBonus(i);}
function stageValue(i){return 3*Math.pow(VSTEP,i)*(owns("hiden")?2:1)*(owns("mise")?2:1);}
function swordValue(){return stageValue(S.open-1);}
function disc(){return owns("mekiki")?0.8:1;}
function wCost(i){return ST[i].wcost*Math.pow(WG,S.w[i])*disc();}
function tCost(i){return ST[i].tcost*Math.pow(TG,S.tool[i])*disc();}
function handPower(){return (owns("kazuuchi")?15:5)*Math.pow(2,lv("te"))*Math.pow(3,lv("hayawaza"));}
function thr(){var m=Infinity;for(var i=0;i<S.open;i++)m=Math.min(m,cap(i));return m===Infinity?0:m;}
function bottleneck(){var bi=0,bc=Infinity;for(var i=0;i<S.open;i++){var c=cap(i);if(c<bc){bc=c;bi=i;}}return bi;}
function wazaGain(){return S.total<1e6?0:Math.max(0,Math.floor(4*Math.pow(Math.log10(S.total)-5,1.6)));}
function nextWazaAt(){return Math.pow(10,Math.pow((wazaGain()+1)/4,1/1.6)+5);}
/* ===== 進行 ===== */
function step(dt){
 for(var i=0;i<S.open;i++){var able=cap(i)*dt;var p=i===0?able:Math.min(able,S.buf[i-1]);
  if(i>0)S.buf[i-1]-=p;S.buf[i]+=p;}
 var done=S.buf[S.open-1];
 if(done>0){S.buf[S.open-1]=0;var m=done*swordValue();S.zeni+=m;S.total+=m;S.made+=done;}
 for(var j=0;j<S.open-1;j++){if(S.buf[j]>bufcap()){var ex=S.buf[j]-bufcap();S.buf[j]=bufcap();var mm=ex*stageValue(j);S.zeni+=mm;S.total+=mm;}}
 if(S.open<ST.length&&S.total>=ST[S.open].at){S.open++;S.w[S.open-1]=Math.max(S.w[S.open-1],1);
  toast("工程「"+ST[S.open-1].name+"」を開きました。通せば1本 "+fmt(swordValue())+"文。通らない分は半端物として売れます。");}
}
function advance(){
 var now=Date.now(),secs=Math.max(0,(now-S.t)/1000);S.t=now;if(secs<=0.01)return;
 secs=Math.min(secs,8*3600);
 var away=(secs>600&&!owns("ro"))?0.5:1, before=S.total;
 var fine=Math.min(secs,90),h=0.25;
 for(var e=0;e<fine;e+=h)step(Math.min(h,fine-e));
 var rest=(secs-fine)*away;
 if(rest>0.5){var g=thr()*rest;if(g>0){var m=g*swordValue();S.zeni+=m;S.total+=m;S.made+=g;
  while(S.open<ST.length&&S.total>=ST[S.open].at){S.open++;S.w[S.open-1]=Math.max(S.w[S.open-1],1);}}}
 if(secs>0.2)S.rate=(S.total-before)/secs;
 if(S.lastBest>0&&S.total>=S.lastBest){toast("前代の稼ぎを超えました（"+ftime((Date.now()-S.runStart)/1000)+"）");S.lastBest=0;}
}
/* ===== 保存 ===== */
function save(){try{S.t=Date.now();localStorage.setItem(SAVE,JSON.stringify(S));}catch(e){}}
function load(){try{var d=JSON.parse(localStorage.getItem(SAVE));if(!d)return;
 var s=fresh(d);for(var i=0;i<ST.length;i++){s.buf[i]=d.buf&&d.buf[i]||0;s.w[i]=(d.w&&d.w[i]!=null)?d.w[i]:(i===0?1:0);s.tool[i]=d.tool&&d.tool[i]||0;}
 s.shop=d.shop||{};s.up=d.up||{};S=s;var b=S.total;advance();if(S.total-b>1)toast("留守のあいだに "+fmt(S.total-b)+" 文になりました");}catch(e){}}
/* ===== 表示 ===== */
var app=document.getElementById("app"),dock=document.getElementById("dock"),
 wrap=document.getElementById("wrap"),sheetEl=document.getElementById("sheet"),toastEl=document.getElementById("toasts");
var sheet=null,wake=null,lastDelta=0,lastTotal=0,sel=0;
function toast(t){var d=document.createElement("div");d.className="toast";d.textContent=t;toastEl.appendChild(d);
 setTimeout(function(){d.remove();},4200);}
function render(){
 var t=thr(),val=swordValue(),inc=Math.max(S.rate||0,t*val),bn=bottleneck(),h="";
 h+='<div class="hud"><div class="row"><span class="zeni">'+fmt(Math.floor(S.zeni))+'<i>文</i></span>'+
    '<span class="inc">毎秒 '+fmt(inc)+(lastDelta>0?'<b class="plus">＋'+fmt(lastDelta)+'</b>':'')+'</span></div>'+
    '<div class="row s"><span>納品 '+fmt(t)+'本/秒　1本 '+fmt(val)+'文</span><span>'+(S.gens+1)+'代目</span></div>'+
    '<div class="bn">'+(t>0?'自動で増えています（毎秒 '+fmt(inc)+'文）。いま詰まっているのは <b>'+ST[bn].name+'</b>。'
      :'まだ自動では増えていません。<b>'+ST[bn].name+'</b>に'+ST[bn].wname+'を入れると、手を離しても進みます。')+'</div></div>';
 h+='<div class="chips">';
 for(var i=0;i<ST.length&&i<=S.open;i++){
  h+='<button class="chip'+(i===sel?' on':'')+(i===bn&&t>0?' bnc':'')+(i>=S.open?' lk':'')+'" data-act="sel" data-i="'+i+'">'+
     '<b>'+SHORT[i]+'</b><em>'+(i>=S.open?'未開':S.w[i]+'人')+'</em></button>';
 }
 h+='<button class="chip jump" data-act="sel" data-i="'+bn+'">詰まりへ</button></div>';
 if(sel>=S.open){
  h+='<div class="st lock"><div style="font-family:serif;font-size:14px">次の工程　'+ST[S.open].name+'</div>'+
     '<div style="font-size:10px;color:var(--mute);margin-top:4px">累計 '+fmt(ST[S.open].at)+' 文で開きます<br>あと '+
     fmt(Math.max(0,ST[S.open].at-S.total))+' 文（'+(inc>0?ftime((ST[S.open].at-S.total)/inc):"—")+'）</div></div>';
 } else {
  var i=sel,c=cap(i),auto=S.w[i]>0,wc=wCost(i),tc=tCost(i),isbn=(i===bn&&t>0);
  h+='<div class="st'+(isbn?' bn2':'')+'"><div class="sthead"><span class="num">'+(i+1)+'</span>'+
     '<span class="stname">'+ST[i].name+'</span>'+(isbn?'<span class="tag">ここが詰まり</span>':'')+
     '<span class="cap">'+(auto?'自動 '+fmt(c)+'/秒':'手作業のみ')+'</span></div>'+
     '<div class="body"><button class="work" data-act="work" data-i="'+i+'">'+
     '<span class="verb">'+ST[i].verb+'</span><span class="hand">手で '+handPower()+' つ</span>'+
     '<span class="stock">'+(i===0?'材はいくらでも':'待ち '+fmt(Math.floor(S.buf[i-1]))+'／'+BUFCAP)+'</span></button>'+
     '<div class="crew"><div class="figs">'+(S.w[i]>0?'●'.repeat(Math.min(S.w[i],5))+'<em>'+S.w[i]+'人</em>':'<em>誰もいない</em>')+'</div>'+
     '<div class="buys">'+
     '<button class="b'+(S.zeni>=wc?' ok':'')+'" data-act="hire" data-i="'+i+'"><b>'+ST[i].wname+' +1</b><em>'+fmt(wc)+'文</em></button>'+
     '<button class="b'+(S.zeni>=tc?' ok':'')+'" data-act="tool" data-i="'+i+'"><b>'+ST[i].tname+' '+(S.tool[i]>0?'改'+S.tool[i]:'を買う')+'</b><em>'+fmt(tc)+'文 ×1.6</em></button>'+
     '</div></div></div><div class="desc">'+ST[i].desc+'</div>';
  if(i<S.open-1){h+='<div class="flow">▼ '+ST[i].makes+' を「'+ST[i+1].name+'」へ'+
    (S.buf[i]>=bufcap()?'<span class="over">置き場が一杯。あふれた分は 1つ '+fmt(stageValue(i))+'文 で売っています</span>':'')+'</div>';}
  else{h+='<div class="flow done">▼ ここが最後。納品して 1本 '+fmt(val)+'文</div>';}
  h+='</div>';
 }
 app.innerHTML=h;
 var g=wazaGain();
 var kbuy=0;for(var q=0;q<KUFU.length;q++){var kk=KUFU[q];if(!kk.rep&&owns(kk.id))continue;if(S.zeni>=kufuCost(kk))kbuy++;}
 dock.innerHTML='<button class="dockb'+(g>0?' hot':'')+'" data-act="sheet" data-s="gen"'+(g<1?' disabled':'')+'>代を譲る<b>'+(g>0?'技+'+g:'累計100万文から')+'</b></button>'+
  '<button class="dockb'+(kbuy>0?' hot':'')+'" data-act="sheet" data-s="kufu">工夫<b>'+(kbuy>0?kbuy+'つ買える':'今代の強化')+'</b></button>'+
  '<button class="dockb" data-act="sheet" data-s="waza">技 '+S.waza+'</button>'+
  '<button class="dockb" data-act="sheet" data-s="kiroku">記録</button>';
 if(sheet)renderSheet();
}
function renderSheet(){
 var h='<div class="shead"><b>'+(sheet==="gen"?"代を譲る":sheet==="kufu"?"工夫":sheet==="waza"?"技":"記録")+'</b><button class="close" data-act="closesheet">閉じる</button></div>';
 if(sheet==="gen"){var g=wazaGain();
  h+='<p class="p">工房も弟子も道具も手放し、次の代に技だけを渡します。<br>・いま譲れば <b>技 +'+g+'</b>（累計 '+(S.wazaTotal+g)+'）<br>'+
     '・工程の速さ <b>×'+speedMult().toFixed(2)+' → ×'+((1+0.08*(S.wazaTotal+g))*(owns("aizuchi")?1.5:1)).toFixed(2)+'</b><br>'+
     '・次代は工程 <b>'+(owns("kaiden")?5:owns("kuden")?3:1)+'</b> まで開いた状態で始まります</p>'+
     '<button class="big" data-act="succeed">'+(S.gens+2)+'代目に譲る</button>';
 } else if(sheet==="kufu"){
  h+='<p class="p">文で買う、今代かぎりの強化です。代替わりで失われます。<br>いまの持ち文 <b>'+fmt(Math.floor(S.zeni))+'</b></p>';
  for(var i=0;i<KUFU.length;i++){var it=KUFU[i];
   var got=!it.rep&&owns(it.id), c=kufuCost(it), can=!got&&S.zeni>=c;
   var name=it.name+(it.rep&&lv(it.id)>0?' '+(lv(it.id)+1)+'段目':'');
   h+='<button class="item'+(can?' can':'')+(got?' got':'')+'" data-act="kufu" data-id="'+it.id+'"'+(can?'':' disabled')+'>'+
      '<span class="iname">'+name+'</span><span class="icost">'+(got?'導入済み':fmt(c)+'文')+'</span>'+
      '<span class="idesc">'+it.desc+(it.rep&&lv(it.id)>0?'（いま '+(it.id==="okiba"?'+'+lv(it.id)*100:'×'+(it.id==="ude"?Math.pow(1.25,lv(it.id)).toFixed(2):it.id==="te"?Math.pow(2,lv(it.id)):lv(it.id)))+'）':'')+'</span></button>';}
 } else if(sheet==="waza"){
  h+='<p class="p">技 '+S.waza+'（累計 '+S.wazaTotal+'・1つにつき全工程 +8%）。技で買うものは代替わりでも残ります。</p>';
  for(var i=0;i<SHOP.length;i++){var it=SHOP[i];
   var got=!it.rep&&owns(it.id), c=wazaCost(it), can=!got&&S.waza>=c;
   var name=it.name+(it.rep&&lv(it.id)>0?' '+(lv(it.id)+1)+'段目':'');
   h+='<button class="item'+(can?' can':'')+(got?' got':'')+'" data-act="shop" data-id="'+it.id+'"'+(can?'':' disabled')+'>'+
      '<span class="iname">'+name+'</span><span class="icost">'+(got?'会得':'技 '+c)+'</span>'+
      '<span class="idesc">'+it.desc+(it.rep&&lv(it.id)>0?'（いま '+(it.id==="kan"?'×'+Math.pow(1.3,lv(it.id)).toFixed(2):'×'+Math.pow(3,lv(it.id)))+'）':'')+'</span></button>';}
 } else {
  h+='<dl><div><dt>今代の稼ぎ</dt><dd>'+fmt(S.total)+'文</dd></div>'+
     '<div><dt>前代の稼ぎ</dt><dd>'+(S.bestTotal?fmt(S.bestTotal)+'文':'—')+'</dd></div>'+
     '<div><dt>納めた刀</dt><dd>'+fmt(S.made)+'本</dd></div>'+
     '<div><dt>手を動かした回数</dt><dd>'+S.hand+'</dd></div>'+
     '<div><dt>今代の時間</dt><dd>'+ftime((Date.now()-S.runStart)/1000)+'</dd></div>'+
     '<div><dt>次の技まで</dt><dd>'+fmt(Math.max(0,nextWazaAt()-S.total))+'文</dd></div></dl>'+
     '<button class="item '+(wake?'got':'can')+'" data-act="wake"><span class="iname">画面を消さない</span>'+
     '<span class="icost">'+(wake?'入':'切')+'</span><span class="idesc">遊んでいるあいだ端末の自動ロックを抑えます。</span></button>'+
     '<p class="p">ロックされても進行は失われません。閉じていた時間ぶんをまとめて計算します（10分までは満額、以降は半分・最大8時間）。</p>'+
     '<div style="display:flex;gap:6px"><button class="sbtn" data-act="save">いま保存</button>'+
     '<button class="sbtn danger" data-act="wipe">初代からやり直す</button></div>';
 }
 sheetEl.innerHTML=h;
}
/* ===== 操作 ===== */
document.addEventListener("click",function(ev){
 var el=ev.target.closest("[data-act]");if(!el)return;
 var a=el.getAttribute("data-act"),i=parseInt(el.getAttribute("data-i"),10);
 advance();
 if(a==="work"){var amt=handPower(),p=i===0?amt:Math.min(amt,S.buf[i-1]);
  if(p<=0){toast(ST[i-1].makes+"がありません。前の工程を先に。");}
  else{if(i>0)S.buf[i-1]-=p;
   if(i===S.open-1){var m=p*swordValue();S.zeni+=m;S.total+=m;S.made+=p;}else S.buf[i]+=p;S.hand++;}}
 else if(a==="hire"){var c=wCost(i);if(S.zeni>=c){S.zeni-=c;S.w[i]++;}}
 else if(a==="tool"){var c2=tCost(i);if(S.zeni>=c2){S.zeni-=c2;S.tool[i]++;}}
 else if(a==="sheet"){sheet=el.getAttribute("data-s");wrap.classList.add("on");}
 else if(a==="closesheet"){sheet=null;wrap.classList.remove("on");}
 else if(a==="shop"){var id=el.getAttribute("data-id");for(var k=0;k<SHOP.length;k++){var it=SHOP[k];
   if(it.id!==id)continue;var c=wazaCost(it);
   if(it.rep){if(S.waza>=c){S.waza-=c;S.up[id]=lv(id)+1;toast("「"+it.name+"」"+lv(id)+"段目");save();}}
   else if(!owns(id)&&S.waza>=c){S.waza-=c;S.shop[id]=1;toast("「"+it.name+"」を会得した");save();}}}
 else if(a==="kufu"){var kid=el.getAttribute("data-id");for(var k2=0;k2<KUFU.length;k2++){var it2=KUFU[k2];
   if(it2.id!==kid)continue;var c2=kufuCost(it2);
   if(it2.rep){if(S.zeni>=c2){S.zeni-=c2;S.up[kid]=lv(kid)+1;toast("「"+it2.name+"」を整えた");save();}}
   else if(!owns(kid)&&S.zeni>=c2){S.zeni-=c2;S.shop[kid]=1;toast("「"+it2.name+"」を整えた");save();}}}
 else if(a==="succeed"){var g=wazaGain();if(g>=1){
   var keep={waza:S.waza+g,wazaTotal:S.wazaTotal+g,shop:S.shop,gens:S.gens+1,start:S.start,
    bestTotal:Math.max(S.bestTotal,S.total),lastBest:Math.max(S.bestTotal,S.total),runStart:Date.now()};
   var head=owns("kaiden")?5:owns("kuden")?3:1;var prevShop=S.shop,prevUp=S.up;
   var keepShop={},keepUp={};
   for(var kk in prevShop){var isKufu=false;for(var z=0;z<KUFU.length;z++)if(KUFU[z].id===kk)isKufu=true;if(!isKufu)keepShop[kk]=1;}
   for(var uu in prevUp){var isK2=false;for(var z2=0;z2<KUFU.length;z2++)if(KUFU[z2].id===uu)isK2=true;if(!isK2)keepUp[uu]=prevUp[uu];}
   keep.shop=keepShop;keep.up=keepUp;
   S=fresh(keep);S.open=head;
   for(var q=0;q<head;q++)S.w[q]=keepShop.kaiden?3:1;
   if(keepShop.takuwae)S.zeni=5000*S.wazaTotal;
   sheet=null;wrap.classList.remove("on");toast((S.gens+1)+"代目が継ぎました。技 +"+g);save();}}
 else if(a==="save"){save();toast("保存しました");}
 else if(a==="wipe"){if(confirm("すべて消して初代からやり直しますか？")){S=fresh();save();sheet=null;wrap.classList.remove("on");}}
 else if(a==="wake"){toggleWake();}
 else if(a==="sel"){sel=i;}
 render();
});
wrap.addEventListener("click",function(e){if(e.target===wrap){sheet=null;wrap.classList.remove("on");}});
function toggleWake(){
 if(wake){try{wake.release();}catch(e){}wake=null;toast("解除しました");return;}
 if(!navigator.wakeLock){toast("この端末では使えません。設定の自動ロックを延ばしてください。");return;}
 navigator.wakeLock.request("screen").then(function(w){wake=w;toast("画面を消さないようにしました");
  w.addEventListener("release",function(){wake=null;});render();})
  .catch(function(){toast("拒否されました。設定の自動ロックを延ばしてください。");});
}
document.addEventListener("visibilitychange",function(){
 try{ if(document.visibilityState==="visible"){advance();render();
   if(wake===null&&navigator.wakeLock){} } else save(); }catch(e){}
});
window.addEventListener("pagehide",save);
/* ===== 起動 ===== */
load();render();
setInterval(function(){var b=S.total;advance();lastDelta=S.total-b;lastTotal=S.total;render();},1000);
setInterval(save,15000);
</script>
</body>
