<html lang="ja">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#15110E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="継ぐ">
<title>継ぐ — 刀鍛冶の工程</title>
<style>
:root{--bg:#15110E;--card:#241C16;--line:#3E3227;--ink:#F0E7D8;--mute:#9C8D7A;--fire:#E2662A;--gold:#D9A441;--steel:#9FB3C8}
*{box-sizing:border-box;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 8px);-webkit-text-size-adjust:100%}
#app{max-width:560px;margin:0 auto;padding:10px 10px 90px}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.hud{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 2px;border-bottom:1px solid var(--line)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.row.s{font-size:10.5px;color:var(--mute);margin-top:4px}
.zeni{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.zeni i{font-style:normal;font-size:13px;color:var(--mute);margin-left:3px}
.inc{font-size:12px;color:var(--steel);font-variant-numeric:tabular-nums;text-align:right}
.plus{display:block;font-size:11px;color:var(--gold)}
.arts{display:flex;gap:4px;margin-top:8px;align-items:center;flex-wrap:wrap}
.art{padding:6px 10px;border:1px solid var(--line);background:#1B1611;color:var(--mute);text-align:center}
.art.rdy{border-color:var(--fire);color:var(--ink);background:#33190F}
.art b{display:block;font-size:11px;font-weight:400;font-family:"Hiragino Mincho ProN",serif}
.art em{display:block;font-style:normal;font-size:9px;margin-top:1px}
.artnone{font-size:10px;color:var(--mute)}
.boost{font-size:10px;color:var(--gold);margin-left:auto}
.bn{margin-top:7px;font-size:11px;color:var(--mute);background:#1E1813;border-left:2px solid var(--fire);padding:5px 8px;min-height:32px}
.bn b{color:var(--fire)}
.chips{display:flex;gap:4px;margin-top:9px;overflow-x:auto;padding-bottom:2px}
.chip{flex:none;padding:5px 8px;border:1px solid var(--line);background:#1B1611;color:var(--mute);text-align:center}
.chip b{display:block;font-size:11px;font-weight:400}
.chip em{display:block;font-style:normal;font-size:9px;margin-top:1px}
.chip.on{border-color:var(--gold);color:var(--ink);background:#2E2519}
.chip.bnc{border-color:var(--fire);color:var(--fire)}
.chip.lk{opacity:.5}
.chip.jump{color:var(--fire);border-color:var(--fire);font-size:10px}
.st{border:1px solid var(--line);background:var(--card);padding:9px 10px;margin-bottom:0}
.st.bn2{border-color:var(--fire)}
.st.lock{opacity:.55;text-align:center;padding:14px 10px;border-style:dashed}
.sthead{display:flex;align-items:center;gap:7px;margin-bottom:7px}
.num{font-size:10px;width:17px;height:17px;line-height:16px;text-align:center;border:1px solid var(--line);color:var(--mute)}
.stname{font-family:"Hiragino Mincho ProN",serif;font-size:15px}
.tag{font-size:9.5px;background:var(--fire);color:#fff;padding:1px 6px}
.cap2{font-size:9px;color:var(--mute)}
.b u{display:block;text-decoration:none;font-size:9.5px;color:var(--steel);margin-top:1px}
.cap{margin-left:auto;text-align:right;line-height:1.35;font-size:10.5px;color:var(--steel);font-variant-numeric:tabular-nums}
.body{display:flex;gap:8px}
.work{flex:1;min-width:0;text-align:left;background:#1B1611;border:1px solid var(--gold);color:var(--ink);padding:10px;touch-action:manipulation;user-select:none}
.work:active{background:#33261A}
.verb{display:block;font-family:"Hiragino Mincho ProN",serif;font-size:15px}
.hand{display:block;font-size:10px;color:var(--gold);margin-top:2px}
.stock{display:block;font-size:10px;color:var(--mute);margin-top:5px;min-height:14px;font-variant-numeric:tabular-nums}
.crew{width:158px;flex:none}
.figs{height:26px;display:flex;align-items:center;gap:1px;overflow:hidden;font-size:18px;color:var(--gold)}
.figs em{font-style:normal;font-size:10px;color:var(--mute);margin-left:4px}
.buys{display:flex;flex-direction:column;gap:4px;margin-top:3px}
.b{text-align:left;padding:6px 7px;border:1px solid var(--line);background:#1B1611;color:var(--mute)}
.b.ok{border-color:var(--gold);color:var(--ink)}
.b b{display:block;font-size:11px;font-weight:400}
.b em{display:block;font-style:normal;font-size:9.5px;color:var(--fire);font-variant-numeric:tabular-nums}
.desc{font-size:10px;color:var(--mute);margin-top:6px;line-height:1.6;min-height:16px}
.flow{text-align:center;font-size:10px;color:var(--mute);padding:4px 0;letter-spacing:.14em}
.flow.done{color:var(--gold)}
.over{display:block;color:var(--fire);font-size:9.5px;letter-spacing:0;margin-top:3px;line-height:1.5}
.gauge{display:block;font-size:9.5px;color:var(--mute);letter-spacing:0;margin-top:3px}
.pile{display:inline-flex;gap:1px;margin-left:6px;vertical-align:bottom;align-items:flex-end;height:18px}
.pile i{width:5px;background:#2A231C;border-radius:1px;display:block;align-self:flex-end}
.pile i.o{background:var(--steel)}
.pile i.f{background:var(--fire)}
.chip{position:relative}
.dot{position:absolute;top:2px;right:2px;width:6px;height:6px;border-radius:50%;background:var(--fire)}
.dock{position:fixed;left:0;right:0;bottom:0;display:flex;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line);max-width:560px;margin:0 auto}
.dockb{flex:1;font-size:12px;padding:10px 4px;border:1px solid var(--line);background:#1E1813;color:var(--mute)}
.dockb.hot{border-color:var(--fire);color:var(--ink);background:#33190F}
.dockb:disabled{opacity:.55}
.dockb b{display:block;font-size:9.5px;color:var(--gold);font-weight:400;margin-top:2px}
.toasts{position:fixed;left:0;right:0;bottom:78px;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:30}
.toast{background:#33281F;border:1px solid var(--gold);font-size:11.5px;padding:7px 13px;max-width:92%}
.wrap{position:fixed;inset:0;background:rgba(10,8,6,.62);z-index:40;display:none;align-items:flex-end;justify-content:center}
.wrap.on{display:flex}
.sheet{width:100%;max-width:560px;max-height:84%;overflow:auto;background:#241C16;border-top:2px solid var(--gold);padding:14px 14px 26px}
.shead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.shead b{font-family:"Hiragino Mincho ProN",serif;font-size:16px;color:var(--gold);letter-spacing:.1em}
.close{font-size:11px;background:none;border:1px solid var(--line);color:var(--mute);padding:6px 12px}
.p{font-size:12px;line-height:1.95;margin:0 0 12px}
.p b{color:var(--gold)}
.big{width:100%;font-size:14px;padding:13px;background:var(--fire);border:0;color:#fff}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 8px;width:100%;text-align:left;background:#1B1611;border:1px solid var(--line);color:var(--ink);padding:10px 11px;margin-bottom:6px;opacity:.6}
.item.can{opacity:1;border-color:var(--gold)}.item.got{opacity:1;border-color:var(--steel)}
.iname{font-family:"Hiragino Mincho ProN",serif;font-size:14px}
.icost{font-size:11.5px;color:var(--fire)}
.idesc{grid-column:1/3;font-size:10.5px;color:var(--mute)}
dl{margin:0 0 10px;display:grid;gap:5px;font-size:12px}
dl div{display:flex;justify-content:space-between;border-bottom:1px dotted var(--line);padding-bottom:3px}
dt{color:var(--mute)}dd{margin:0;font-variant-numeric:tabular-nums}
.ttabs{display:flex;gap:4px;margin-bottom:10px}
.ttab{flex:1;padding:7px 4px;border:1px solid var(--line);background:#1B1611;color:var(--mute);font-family:"Hiragino Mincho ProN",serif;font-size:14px}
.ttab.on{border-color:var(--gold);color:var(--gold);background:#2E2519}
.ttab em{display:block;font-style:normal;font-size:9px;font-family:inherit}
.bname{font-family:"Hiragino Mincho ProN",serif;font-size:12px;color:var(--gold);margin:10px 0 4px;letter-spacing:.1em}
.branch{display:flex;align-items:center;overflow-x:auto;padding-bottom:4px}
.node{flex:none;width:92px;padding:6px 5px;border:1px solid var(--line);background:#1B1611;color:var(--mute);text-align:left}
.node b{display:block;font-size:11px;font-weight:400;color:var(--ink)}
.node em{display:block;font-style:normal;font-size:10px;color:var(--fire);margin-top:1px}
.node i{display:block;font-style:normal;font-size:8.5px;line-height:1.35;margin-top:2px;height:24px;overflow:hidden}
.node.can{border-color:var(--gold)}
.node.got{border-color:var(--steel);background:#20262E;color:var(--steel)}
.node.got em{color:var(--steel)}
.node.shut{opacity:.42}
.link{flex:none;width:10px;height:1px;background:var(--line)}
.final{border:1px solid var(--gold);padding:10px;margin-top:6px}
.final b{font-family:"Hiragino Mincho ProN",serif;font-size:15px;color:var(--gold)}
.sbtn{flex:1;font-size:12px;padding:10px;background:none;border:1px solid var(--line);color:var(--ink)}
.sbtn.danger{border-color:var(--fire);color:var(--fire)}
@media (max-width:400px){.crew{width:140px}.zeni{font-size:26px}}
</style>
</head>

 var e={sp:1,hd:1,hs:0,bs:0,cd:1,va:1,ov:1,wc:1,tc:1,ku:1,bf:0,op:0,wk:0,zn:0,wz:1,of:0.5,oc:8,st:[1,1,1,1,1,1,1]};
 e.ov=0.5;
 for(var id in S.node){var nd=NODEBY[id];if(!nd)continue;var f=nd.eff;
  if(f.sp)e.sp*=f.sp; if(f.hd)e.hd*=f.hd; if(f.hs)e.hs=(e.hs||0)+f.hs; if(f.va)e.va*=f.va; if(f.ov)e.ov*=f.ov;
  if(f.wc)e.wc*=f.wc; if(f.tc)e.tc*=f.tc; if(f.ku)e.ku*=f.ku; if(f.bf)e.bf+=f.bf;
  if(f.op)e.op+=f.op; if(f.wk)e.wk+=f.wk; if(f.zn)e.zn+=f.zn; if(f.wz)e.wz*=f.wz;
  if(f.of)e.of=Math.max(e.of,f.of); if(f.oc)e.oc=Math.max(e.oc,f.oc);
  if(f.st!==undefined)e.st[f.st]*=f.m;}
 for(var q=0;q<KUFU.length;q++){var it=KUFU[q],n=it.rep?(S.up[it.id]||0):(S.shop[it.id]?1:0);
  if(!n)continue;var g=it.ef;
  if(g.sp)e.sp*=Math.pow(g.sp,n); if(g.va)e.va*=Math.pow(g.va,n); if(g.ov)e.ov*=Math.pow(g.ov,n);
  if(g.wc)e.wc*=Math.pow(g.wc,n); if(g.tc)e.tc*=Math.pow(g.tc,n); if(g.cd)e.cd*=Math.pow(g.cd,n);
  if(g.hs)e.hs+=g.hs*n; if(g.bs)e.bs+=g.bs*n;
  if(g.st!==undefined)e.st[g.st]*=Math.pow(g.m,n);}

}

  if(i>0)S.buf[i-1]-=p;S.buf[i]+=p;}

  while(S.open<ST.length&&S.total>=ST[S.open].at){S.open++;S.w[S.open-1]=Math.max(S.w[S.open-1],1);}}}
 if(secs>0.2)S.rate=(S.total-before)/secs;

     '<span>'+ST[i].name+(i===S.open-1?'（納品）':'（半端物）')+'</span>'+
     '<span>毎秒 '+fmt(now[i])+'　累計 '+fmt(S.rev[i]||0)+'</span></div>'+
     '<div style="height:4px;background:#2E251D;margin-top:2px"><i style="display:block;height:100%;width:'+pn.toFixed(1)+'%;background:var(--gold)"></i></div>'+
     '<div style="height:3px;background:#2E251D;margin-top:1px"><i style="display:block;height:100%;width:'+pt.toFixed(1)+'%;background:var(--steel)"></i></div></div>';}
 s+='<p class="p" style="font-size:10px">金の帯＝いまの毎秒の割合／青の帯＝今代の累計の割合</p>';
 return s;}
function renderSheet(){
 var h='<div class="shead"><b>'+(sheet==="gen"?"代を譲る":sheet==="kufu"?"工夫":sheet==="waza"?"技":"記録")+'</b><button class="close" data-act="closesheet">閉じる</button></div>';
 if(sheet==="gen"){var g=wazaGain();
  h+='<p class="p">工房も弟子も道具も手放し、次の代に技だけを渡します。<br>・いま譲れば <b>技 +'+g+'</b>（累計 '+(S.wazaTotal+g)+'）<br>'+
     '・技による速さ <b>×'+(1+0.02*S.wazaTotal).toFixed(2)+' → ×'+(1+0.02*(S.wazaTotal+g)).toFixed(2)+'</b>（ツリーの倍率はそのまま残ります）<br>'+
     '・次代は工程 <b>'+Math.min(ST.length,1+E.op)+'</b> まで開き、各工程に弟子 <b>'+(1+E.wk)+'</b> 人、持ち文 <b>'+fmt(E.zn)+'</b> で始まります<br>'+
     '・失うもの：工夫・弟子・道具・在庫　残るもの：技とツリー・発動技</p>'+
     '<button class="big" data-act="succeed">'+(S.gens+2)+'代目に譲る</button>';
 } else if(sheet==="ending"){
  h+='<div class="final"><b>百工を継ぐ</b>'+
     '<p class="p">技の百すべてを継ぎました。<br><br>'+
     'たたらの火から銘切りまで、七つの工程のすべてを識り、'+(S.gens+1)+'代にわたって'+fmt(S.made)+'振りを打ち上げた。'+
     'この工房の刀は、いま国宝に列せられています。<br><br>'+
     '<b>'+fmt(S.grandTotal||S.total)+'文</b>　'+(S.gens+1)+'代　'+fmt(S.made)+'振り<br>'+
     '開いてから '+ftime((Date.now()-S.start)/1000)+'</p>'+
     '<button class="big" data-act="closesheet">工房を続ける</button>'+
     '<p class="p" style="font-size:10px;margin-top:10px">この先も自由に打ち続けられます。</p></div>';
 } else if(sheet==="kufu"){
  h+='<p class="p">文で買う、今代かぎりの強化です。代替わりで失われます。<br>持ち文 <b>'+fmt(Math.floor(S.zeni))+'</b>　'+
     '稼ぎが増えると新しい工夫が現れます。</p>';
  var groups=[["重ねて買えるもの",1],["工程ごと・特別なもの",0]];
  for(var gi=0;gi<groups.length;gi++){
   var rows="";
   for(var i=0;i<KUFU.length;i++){var it=KUFU[i];
    if((it.rep?1:0)!==groups[gi][1])continue;
    if(S.total<(it.at||0))continue;
    var got=!it.rep&&owns(it.id), c=kufuCost(it), can=!got&&S.zeni>=c, n=S.up[it.id]||0;
    var nm=it.name+(it.rep&&n>0?' '+(n+1)+'段目':'');
    var now="";
    if(it.rep&&n>0){var g=it.ef;
     now=g.sp?'（いま ×'+Math.pow(g.sp,n).toFixed(2)+'）':g.va?'（いま ×'+Math.pow(g.va,n).toFixed(2)+'）':
         g.ov?'（いま ×'+Math.pow(g.ov,n).toFixed(2)+'）':g.hs?'（いま +'+(g.hs*n)+'秒）':
         g.bs?'（いま +'+(g.bs*n)+'秒）':g.wc?'（いま ×'+Math.pow(g.wc,n).toFixed(2)+'）':
         g.tc?'（いま ×'+Math.pow(g.tc,n).toFixed(2)+'）':'（'+n+'段）';}
    rows+='<button class="item'+(can?' can':'')+(got?' got':'')+'" data-act="kufu" data-id="'+it.id+'"'+(can?'':' disabled')+'>'+
      '<span class="iname">'+nm+'</span><span class="icost">'+(got?'導入済み':fmt(c)+'文')+'</span>'+
      '<span class="idesc">'+it.desc+now+'</span></button>';}
   if(rows)h+='<div class="bname">'+groups[gi][0]+'</div>'+rows;
  }
  var hidden=0;for(var i2=0;i2<KUFU.length;i2++)if(S.total<(KUFU[i2].at||0))hidden++;
  if(hidden)h+='<p class="p" style="font-size:10px">まだ現れていない工夫が '+hidden+' つあります。</p>';
 } else if(sheet==="waza"){
  h+='<p class="p">技 <b>'+S.waza+'</b>（累計 '+S.wazaTotal+'）　取得 '+nodeCount()+'／'+NODES.length+
     '<br>どの枝から伸ばすかは自由。取ったものは永久に残ります。奥ほど費えが跳ね上がります。'+
     (nodeCount()>=NODES.length?'<br><b>百工すべてを継ぎました。</b>':'')+'</p>';
  h+='<div class="ttabs">';
  for(var t=0;t<TREE.length;t++){h+='<button class="ttab'+(ttab===TREE[t].id?' on':'')+'" data-act="ttab" data-t="'+TREE[t].id+'">'+
    TREE[t].name+'<em>'+treeCount(TREE[t].id)+'/33</em></button>';}
  h+='<button class="ttab'+(ttab==="final"?' on':'')+'" data-act="ttab" data-t="final">皆伝</button></div>';
  if(ttab==="final"){
   var nd=KAIDEN,ok=nodeOpen(nd),got=hasNode(nd.id),c=nodeCost(nd);
   h+='<div class="final"><b>皆伝</b><p class="p">三系統すべてで6つ以上を得ると開きます（鍛 '+treeCount("kitae")+'／商 '+treeCount("akinai")+'／伝 '+treeCount("tsutae")+'）。<br>すべての工程が3倍、刀の値が3倍、技の獲得が2倍。</p>'+
     '<button class="item'+(got?' got':(ok&&S.waza>=c?' can':''))+'" data-act="node" data-id="'+nd.id+'"'+((!got&&ok&&S.waza>=c)?'':' disabled')+'>'+
     '<span class="iname">皆伝</span><span class="icost">'+(got?'会得':'技 '+fmt(c))+'</span>'+
     '<span class="idesc">'+(ok?'条件を満たしています':'まだ条件を満たしていません')+'</span></button></div>';
  } else {
   var tr=null;for(var t2=0;t2<TREE.length;t2++)if(TREE[t2].id===ttab)tr=TREE[t2];
   for(var b=0;b<tr.branches.length;b++){var br=tr.branches[b];
    h+='<div class="bname">'+tr.name+'・'+br.name+'</div><div class="branch">';
    for(var k=0;k<br.names.length;k++){
     var nd2=NODEBY[br.id+k],got2=hasNode(nd2.id),ok2=nodeOpen(nd2),c2=nodeCost(nd2);
     var can2=!got2&&ok2&&S.waza>=c2;
     h+='<button class="node'+(got2?' got':'')+(can2?' can':'')+(!ok2?' shut':'')+'" data-act="node" data-id="'+nd2.id+'">'+
        '<b>'+nd2.name+'</b><em>'+(got2?'会得':fmt(c2))+'</em><i>'+effText(nd2.eff)+'</i></button>';
     if(k<br.names.length-1)h+='<span class="link"></span>';
    }
    h+='</div>';
   }
  }
 } else {
  h+='<dl><div><dt>今代の稼ぎ</dt><dd>'+fmt(S.total)+'文</dd></div>'+
     '<div><dt>前代の稼ぎ</dt><dd>'+(S.bestTotal?fmt(S.bestTotal)+'文':'—')+'</dd></div>'+
     '<div><dt>納めた刀</dt><dd>'+fmt(S.made)+'本</dd></div>'+
     '<div><dt>手を動かした回数</dt><dd>'+S.hand+'</dd></div>'+
     '<div><dt>今代の時間</dt><dd>'+ftime((Date.now()-S.runStart)/1000)+'</dd></div>'+
     '<div><dt>次の技まで</dt><dd>'+fmt(Math.max(0,nextWazaAt()-S.total))+'文</dd></div></dl>'+
     revTable()+
     '<button class="item '+(wake?'got':'can')+'" data-act="wake"><span class="iname">画面を消さない</span>'+
     '<span class="icost">'+(wake?'入':'切')+'</span><span class="idesc">遊んでいるあいだ端末の自動ロックを抑えます。</span></button>'+
     '<p class="p">ロックされても進行は失われません。閉じていた時間ぶんをまとめて計算します（10分までは満額、以降は半分・最大8時間）。</p>'+
     '<div style="display:flex;gap:6px"><button class="sbtn" data-act="save">いま保存</button>'+
     '<button class="sbtn danger" data-act="wipe">初代からやり直す</button></div>';
 }
 sheetEl.innerHTML=h;
}
/* ===== 操作 ===== */
document.addEventListener("click",function(ev){
 var el=ev.target.closest("[data-act]");if(!el)return;
 var a=el.getAttribute("data-act"),i=parseInt(el.getAttribute("data-i"),10);
 advance();
 if(a==="work"){var p=handReal(i);
  if(p<=0){toast(ST[i-1].makes+"がありません。前の工程を先に。");}
  else{if(i>0)S.buf[i-1]-=p;
   if(i===S.open-1){var m=p*swordValue();S.zeni+=m;S.total+=m;S.made+=p;}else S.buf[i]+=p;S.hand++;}}
 else if(a==="hire"){var c=wCost(i);if(S.zeni>=c){S.zeni-=c;S.w[i]++;}}
 else if(a==="tool"){var c2=tCost(i);if(S.zeni>=c2){S.zeni-=c2;S.tool[i]++;}}
 else if(a==="sheet"){sheet=el.getAttribute("data-s");wrap.classList.add("on");}
 else if(a==="closesheet"){sheet=null;wrap.classList.remove("on");}
 else if(a==="ttab"){ttab=el.getAttribute("data-t");}
 else if(a==="node"){var nid=el.getAttribute("data-id"),nd=NODEBY[nid];
   if(nd&&!hasNode(nid)){
    if(!nodeOpen(nd))toast(nd.need?"先に「"+NODEBY[nd.need].name+"」を得てください":"まだ条件を満たしていません");
    else{var c=nodeCost(nd);
     if(S.waza<c)toast("技が "+fmt(c-S.waza)+" 足りません");
     else{S.waza-=c;S.node[nid]=1;recalc();toast("「"+nd.name+"」を会得した（"+effText(nd.eff)+"）");save();
      if(nodeCount()>=NODES.length&&!S.ended){S.ended=Date.now();sheet="ending";wrap.classList.add("on");save();}}}}}
 else if(a==="kufu"){var kid=el.getAttribute("data-id");for(var k2=0;k2<KUFU.length;k2++){var it2=KUFU[k2];
   if(it2.id!==kid)continue;var c2=kufuCost(it2);
   if(it2.rep){if(S.zeni>=c2){S.zeni-=c2;S.up[kid]=lv(kid)+1;recalc();toast("「"+it2.name+"」を整えた");save();}}
   else if(!owns(kid)&&S.zeni>=c2){S.zeni-=c2;S.shop[kid]=1;recalc();toast("「"+it2.name+"」を整えた");save();}}}
 else if(a==="succeed"){var g=wazaGain();if(g>=1){
   var keep={waza:S.waza+g,wazaTotal:S.wazaTotal+g,shop:S.shop,gens:S.gens+1,start:S.start,
    bestTotal:Math.max(S.bestTotal,S.total),lastBest:Math.max(S.bestTotal,S.total),runStart:Date.now()};
   var head=Math.min(ST.length,1+E.op);var prevShop=S.shop,prevUp=S.up,prevNode=S.node;
   var keepShop={},keepUp={};
   for(var kk in prevShop){var isKufu=false;for(var z=0;z<KUFU.length;z++)if(KUFU[z].id===kk)isKufu=true;if(!isKufu)keepShop[kk]=1;}
   for(var uu in prevUp){var isK2=false;for(var z2=0;z2<KUFU.length;z2++)if(KUFU[z2].id===uu)isK2=true;if(!isK2)keepUp[uu]=prevUp[uu];}
   keep.shop=keepShop;keep.up=keepUp;keep.node=prevNode;
   S=fresh(keep);S.open=head;recalc();
   for(var q=0;q<head;q++)S.w[q]=1+E.wk;
   S.zeni=E.zn;
   sheet=null;wrap.classList.remove("on");toast((S.gens+1)+"代目が継ぎました。技 +"+g);
   for(var z=0;z<ARTS.length;z++)if(ARTS[z].need===S.gens)toast("発動技「"+ARTS[z].name+"」を授かった");save();}}
 else if(a==="save"){save();toast("保存しました");}
 else if(a==="wipe"){if(confirm("すべて消して初代からやり直しますか？")){S=fresh();save();sheet=null;wrap.classList.remove("on");}}
 else if(a==="wake"){toggleWake();}
 else if(a==="sel"){sel=i;}
 else if(a==="art"){var aid=el.getAttribute("data-id");for(var z=0;z<ARTS.length;z++)if(ARTS[z].id===aid)fireArt(ARTS[z]);}
 render();
});
wrap.addEventListener("click",function(e){if(e.target===wrap){sheet=null;wrap.classList.remove("on");}});
function toggleWake(){
 if(wake){try{wake.release();}catch(e){}wake=null;toast("解除しました");return;}
 if(!navigator.wakeLock){toast("この端末では使えません。設定の自動ロックを延ばしてください。");return;}
 navigator.wakeLock.request("screen").then(function(w){wake=w;toast("画面を消さないようにしました");
  w.addEventListener("release",function(){wake=null;});render();})
  .catch(function(){toast("拒否されました。設定の自動ロックを延ばしてください。");});
}
document.addEventListener("visibilitychange",function(){
 try{ if(document.visibilityState==="visible"){advance();render();
   if(wake===null&&navigator.wakeLock){} } else save(); }catch(e){}
});
window.addEventListener("pagehide",save);
/* ===== 起動 ===== */
recalc();load();recalc();render();
setInterval(function(){var b=S.total;advance();lastDelta=S.total-b;render();},1000);
setInterval(save,15000);
</script>
